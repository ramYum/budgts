name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # `next build` imports the Plaid route handlers to collect their config, and src/lib/db/client
          # throws at import time if DATABASE_URL is unset. A placeholder is enough: nothing connects
          # during the build. (Without it this step failed on every push to main.)
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
