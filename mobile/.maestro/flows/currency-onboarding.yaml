# Get Started, currency step, for a freshly signed-in (not yet onboarded) account. The device's time zone is sent with
# the currency (no screen for it; a device without one sees the time zone message and stays here). Run once with the
# device set to a zone far from UTC (e.g. Pacific/Kiritimati) to check Home's month follows it. Assumes sign-in already happened
# (chain after sign-in.yaml, or run against a native-only test account created without a currency). Unexecuted — see
# .maestro/README.md.
appId: com.budgts.app
---
- assertVisible:
    id: "currency-USD"
- tapOn:
    id: "currency-USD"
- tapOn:
    id: "get-started-continue"
- assertVisible:
    text: "Connect your bank"
- tapOn:
    id: "get-started-finish" # skip the bank step for this flow
- assertNotVisible:
    text: "time zone"
- assertVisible:
    id: "tab-home"
